name: Full platform release validation (manual)
on:
  workflow_dispatch:
    inputs:
      container:
        description: Also build and verify the Docker image (uses more runner minutes)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: foodflow
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d foodflow"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      FOODFLOW_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/foodflow
      FOODFLOW_ETL_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/foodflow
      FOODFLOW_RELEASE_REVISION: ${{ github.sha }}
      FOODFLOW_REPORT_DIR: /tmp/foodflow-release
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and verify locked Python dependencies
        run: |
          python -m pip install --upgrade 'pip==26.2.2'
          python -m pip install -r requirements-test.lock -r requirements-test.txt -r requirements-postgres.txt
          python -m pip check
          python scripts/check_dependencies.py --lock requirements-test.lock
      - name: Python tests with a disposable PostgreSQL server
        run: python -m pytest -q
      - name: Build bundled warehouse and evaluated artifact (never generate sources)
        run: |
          python -m src.pipeline build
          python -m src.intelligence.train --report "$FOODFLOW_REPORT_DIR/evaluation.json"
      - name: PostgreSQL CLI idempotent publication
        run: |
          python -m src.warehouse.cli run > "$FOODFLOW_REPORT_DIR/first-etl.json"
          python -m src.warehouse.cli run > "$FOODFLOW_REPORT_DIR/repeated-etl.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ['FOODFLOW_REPORT_DIR'])/'repeated-etl.json').read_text())
          assert result['status']=='SUCCESS'
          assert all(c['inserted']==c['updated']==0 for t,c in result['counts'].items() if t!='models')
          assert all(c['changed']==0 for c in result['counts']['models'].values())
          PY
      - name: Locked frontend and browser installation
        run: |
          npm ci --prefix frontend --no-fund --no-audit
          cd frontend
          npx playwright install --with-deps chromium
      - name: Production build, browser suite and warehouse reconciliation
        run: bash scripts/validate_web.sh
      - name: Dependency vulnerability audits
        run: |
          npm audit --prefix frontend
          python -m venv "$RUNNER_TEMP/auditor"
          "$RUNNER_TEMP/auditor/bin/python" -m pip install pip-audit
          "$RUNNER_TEMP/auditor/bin/pip-audit" --strict -r requirements-test.lock --no-deps --disable-pip
      - name: Optional container gate
        if: ${{ inputs.container }}
        run: |
          docker build --build-arg FOODFLOW_REVISION="$GITHUB_SHA" -t foodflow-release:check .
          python scripts/check_container.py --image foodflow-release:check --expected-revision "$GITHUB_SHA" --report "$FOODFLOW_REPORT_DIR/container-check.json"
      - name: Preserve bundled sources
        run: git diff --exit-code -- data/raw
      - name: Retain validation evidence (no credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ env.FOODFLOW_REPORT_DIR }}
            frontend/test-results
