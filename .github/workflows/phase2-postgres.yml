name: Phase 2 warehouse validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - 'sql/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/phase2-postgres.yml'
  push:
    branches: [feature/phase-2-incremental-warehouse]
permissions:
  contents: read
jobs:
  warehouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: foodflow
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d foodflow"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      FOODFLOW_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/foodflow
      FOODFLOW_ETL_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/foodflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade 'pip>=26.2,<27'
      - run: python -m pip install -r requirements-test.txt -r requirements-postgres.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Exercise automated CLI publication and idempotent retry
        run: |
          python -m src.warehouse.cli run > /tmp/first-run.json
          python -m src.warehouse.cli run > /tmp/repeated-run.json
          python - <<'PY'
          import json
          with open('/tmp/repeated-run.json') as f:
              result = json.load(f)
          assert result['status'] == 'SUCCESS'
          for table, counts in result['counts'].items():
              if table != 'models':
                  assert counts['inserted'] == counts['updated'] == 0
          assert all(m['changed'] == 0 for m in result['counts']['models'].values())
          PY
      - name: Confirm tracked sample data was preserved
        run: git diff --exit-code -- data/raw
